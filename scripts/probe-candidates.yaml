# Кандидаты в источники для пробы (scripts/probe-sources.ts, маркер
# «probe» в .github/report.trigger). Попадают в config.yaml только те,
# чьи образцы выдержали просмотр.
#
# Проба 1 (18.10): NHHC, Fortepan, Национальная библиотека Ирландии,
# Anefo-культура, плакаты ПМВ, Хайн и пыльный котёл у LOC.
# Проба 2 (18.10): современная армия из NARA и ВВС США, плакаты ВМВ и
# советские плакаты.
# Проба 3 - советская повседневность (РИА по бытовым словам) и карикатуры
# 1914-1991; Europeana - если заведён ключ.
commons:
  - category: "Images from RIA Novosti"
    lang: "ru"
    window: [1945, 1991]
    terms:
      ["children", "Pioneers", "collective farmers", "Muscovites", "department store",
       "vacationers", "students", "shop assistant", "metro station", "construction workers"]
  - category: "World War I cartoons"
    deep: true
  - category: "World War II cartoons"
    deep: true
  - category: "Cartoons from Punch"
    deep: true
    terms: ["1915", "1940"]
  - category: "Caricatures of Adolf Hitler"
    deep: true
loc:
  - "cartoon 1917 war"
  - "political cartoon 1918"
  - "caricature 1941"
europeana:
  - "world war 1914-1918 photograph"
  - "soldiers 1916"
  - "poster 1917"
