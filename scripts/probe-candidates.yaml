# Кандидаты в источники для пробы (scripts/probe-sources.ts, маркер
# «probe» в .github/report.trigger). Попадают в config.yaml только те,
# чьи образцы выдержали просмотр.
#
# Проба 1 (18.10): NHHC, Fortepan, Национальная библиотека Ирландии,
# Anefo-культура, плакаты ПМВ, Хайн и пыльный котёл у LOC.
# Проба 2: современная армия из NARA и ВВС США, плакаты ВМВ, советский плакат.
# Проба 3: карикатуры ПМВ и на Гитлера, карикатуры LOC. Советская
# повседневность поиском по словам РИА не находится (2-3 кадра эпохи на
# десятки современных).
# Проба 4: тематические категории о быте СССР на Commons пусты или
# приносят саммиты, космонавтов и марки - чистого источника для рубрики
# ussr_daily нет, она стоит без поставщика.
commons:
  - category: "Daily life in the Soviet Union"
    deep: true
    window: [1945, 1991]
  - category: "Society of the Soviet Union"
    deep: true
    window: [1945, 1991]
  - category: "Shops in the Soviet Union"
    deep: true
    window: [1945, 1991]
  - category: "Queues in the Soviet Union"
    deep: true
    window: [1945, 1991]
  - category: "Soviet Union in the 1960s"
    deep: true
    window: [1945, 1991]
  - category: "Moscow in the 1960s"
    deep: true
    window: [1945, 1991]
  - category: "RIAN archive"
    deep: true
    terms: ["Moscow 1965", "kolkhoz", "store"]
    window: [1945, 1991]
europeana:
  - "world war 1914-1918 photograph"
  - "soldiers 1916"
  - "poster 1917"
