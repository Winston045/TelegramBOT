name: topup

# Автодобор резерва: в режиме /auto бот сам ходит за новыми кандидатами,
# когда готовых меньше, чем слотов впереди. Ручной /more больше не нужен.
# Сторож бережёт квоту Gemini: не чаще двух внеплановых сборов в сутки.

on:
  schedule:
    # Дважды в сутки вместо каждых трёх часов (15.08: экономия минут
    # Actions). Утренний заход - после ежедневного сбора (08:20 UTC, не
    # дольше 30 минут), чтобы два сбора не шли одновременно по одним и тем
    # же страницам архивов. Реальную нужду по-прежнему решает сторож.
    - cron: "5 9,15 * * *"
  workflow_dispatch: {}
  push:
    branches: [claude/starting-work-tpehs7]
    paths:
      - ".github/topup.trigger"

# одна очередь с /more: два сбора разом читали одни курсоры, дважды
# разбирали одни кадры и слали редакторам одинаковые карточки
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      EDITORS_CHAT_ID: ${{ secrets.EDITORS_CHAT_ID }}
      EDITOR_USER_IDS: ${{ secrets.EDITOR_USER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
    steps:
      - name: Секреты настроены?
        id: guard
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$SUPABASE_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "секреты не настроены — запуск пропущен"
          fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
        if: steps.guard.outputs.ok == 'true'
      # Пуш маркера .github/topup.trigger - это ручная просьба собрать
      # сейчас: сторож пропускается. Размер партии можно задать в самом
      # маркере строкой force:N (потолок 30), без неё - маленькая шестёрка.
      # По расписанию решает сторож, как и раньше.
      - name: Нужен ли добор
        id: need
        if: steps.guard.outputs.ok == 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            n=$(grep -oP 'force:\K\d+' .github/topup.trigger || echo 6)
            npx tsx scripts/topup-guard.ts --force "$n"
          else
            npx tsx scripts/topup-guard.ts
          fi
      # размер партии считает сторож: ровно столько, сколько не хватает
      # до запаса, с поправкой на выбраковку по порогу оценки
      # only:<источник> в маркере - сбор из одного источника (проба нового
      # архива целой партией: «force:30 only:europeana»). По расписанию -
      # всегда все включённые источники
      - name: Сбор свежей партии
        if: steps.need.outputs.need == 'true'
        run: |
          only=""
          if [ "${{ github.event_name }}" = "push" ]; then
            only=$(grep -oP 'only:\K[a-z]+' .github/topup.trigger || true)
          fi
          npm run collect -- --keep ${{ steps.need.outputs.keep }} ${only:+--only $only}
      - name: Карточки редакторам
        if: always() && steps.need.outputs.need == 'true'
        run: npm run send-candidates -- --limit 3
