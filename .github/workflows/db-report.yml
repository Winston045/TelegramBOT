name: db-report

# Отчёт по кандидатам в базе: статусы, подписи, метаданные.
# Запуск: пуш в .github/report.trigger или Actions → Run workflow.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/report.trigger"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      EDITORS_CHAT_ID: ${{ secrets.EDITORS_CHAT_ID }}
      # для режима keys: проверка пула ключей Gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      # "style" в триггер-файле - выгрузить тексты постов канала вместо
      # отчёта; "before:5000" - нырнуть в архив старше поста #5000
      - name: Отчёт
        run: |
          if grep -q resettopup .github/report.trigger 2>/dev/null; then
            npx tsx scripts/reset-topup.ts
          elif grep -q migrate .github/report.trigger 2>/dev/null; then
            npm run migrate
          elif grep -q tagleaders .github/report.trigger 2>/dev/null; then
            npx tsx scripts/tag-leaders.ts
          elif grep -q simulate .github/report.trigger 2>/dev/null; then
            npx tsx scripts/simulate.ts
          elif grep -q fixplace .github/report.trigger 2>/dev/null; then
            npx tsx scripts/fix-place.ts
          elif grep -q ctxprobe .github/report.trigger 2>/dev/null; then
            npx tsx scripts/probe-context.ts 6
          elif grep -q reserve .github/report.trigger 2>/dev/null; then
            npx tsx scripts/reserve-report.ts
          elif grep -q cards .github/report.trigger 2>/dev/null; then
            # выслать карточки из уже готового резерва: Gemini не тратим,
            # сбор не запускаем - только показываем то, что уже разобрано
            n=$(grep -oP 'cards:\K\d+' .github/report.trigger || true)
            npm run send-candidates -- --limit ${n:-3}
          elif grep -q keys .github/report.trigger 2>/dev/null; then
            # пул ключей Gemini: сколько видит бот и живой ли каждый
            npx tsx scripts/keys-check.ts
          elif grep -q sources .github/report.trigger 2>/dev/null; then
            # проверка источников: каждый архив и запрос по отдельности
            npx tsx scripts/sources-check.ts
          elif grep -q diversity .github/report.trigger 2>/dev/null; then
            # разбор вышедших постов: архивы, эпохи, темы, серии подряд
            n=$(grep -oP 'diversity:\K\d+' .github/report.trigger || true)
            npx tsx scripts/diversity.ts ${n:-60}
          elif grep -q handwork .github/report.trigger 2>/dev/null; then
            # ручная редактура канала: чем жили посты до бота
            from=$(grep -oP 'from:\K\d{4}-\d{2}' .github/report.trigger || true)
            to=$(grep -oP 'to:\K\d{4}-\d{2}' .github/report.trigger || true)
            npx tsx scripts/channel-posts.ts --from "$from" --to "$to" --brief
          elif grep -q style .github/report.trigger 2>/dev/null; then
            before=$(grep -oP 'before:\K\d+' .github/report.trigger || true)
            month=$(grep -oP 'month:\K\d{4}-\d{2}' .github/report.trigger || true)
            npx tsx scripts/channel-posts.ts 30 ${before:+--before $before} ${month:+--month $month}
          else
            npm run review-captions -- 15
          fi
