name: db-report

# Отчёт по кандидатам в базе: статусы, подписи, метаданные.
# Запуск: пуш в .github/report.trigger или Actions → Run workflow.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/report.trigger"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      # "style" в триггер-файле - выгрузить тексты постов канала вместо
      # отчёта; "before:5000" - нырнуть в архив старше поста #5000
      - name: Отчёт
        run: |
          if grep -q style .github/report.trigger 2>/dev/null; then
            before=$(grep -oP 'before:\K\d+' .github/report.trigger || true)
            npx tsx scripts/channel-posts.ts 30 ${before:+--before $before}
          else
            npm run review-captions -- 15
          fi
