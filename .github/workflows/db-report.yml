name: db-report

# Отчёт по кандидатам в базе: статусы, подписи, метаданные.
# Запуск: пуш в .github/report.trigger или Actions → Run workflow.

on:
  workflow_dispatch: {}
  push:
    # маркер с другой ветки не должен гонять её непроверенный код по боевой базе
    branches: [claude/starting-work-tpehs7]
    paths:
      - ".github/report.trigger"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      EDITORS_CHAT_ID: ${{ secrets.EDITORS_CHAT_ID }}
      # для режима keys: проверка пула ключей Gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      # "style" в триггер-файле - выгрузить тексты постов канала вместо
      # отчёта; "before:5000" - нырнуть в архив старше поста #5000
      # Режим - ПЕРВОЕ слово маркера («diversity:40 …» → diversity), а не
      # любое слово где-то в тексте: grep по всему файлу давал первое
      # совпадение по цепочке. Ручной «Run workflow» маркер не читает и
      # гонит безопасный отчёт - раньше он молча повторял последний режим,
      # в том числе пишущие в базу purgenonphoto, fixplace и migrate.
      - name: Отчёт
        run: |
          mode=""
          if [ "${{ github.event_name }}" = "push" ]; then
            mode=$(head -n1 .github/report.trigger | awk '{print $1}' | cut -d: -f1)
          fi
          echo "режим: ${mode:-по умолчанию}"
          case "$mode" in
            purgenonphoto)
              # рисунки и плакаты из резерва и очереди - по описанию архива
              npx tsx scripts/purge-nonphoto.ts ;;
            resettopup) npx tsx scripts/reset-topup.ts ;;
            migrate) npm run migrate ;;
            tagleaders) npx tsx scripts/tag-leaders.ts ;;
            simulate) npx tsx scripts/simulate.ts ;;
            fixplace) npx tsx scripts/fix-place.ts ;;
            ctxprobe) npx tsx scripts/probe-context.ts 6 ;;
            reserve) npx tsx scripts/reserve-report.ts ;;
            cards)
              # выслать карточки из уже готового резерва: Gemini не тратим,
              # сбор не запускаем - только показываем то, что уже разобрано
              n=$(grep -oP 'cards:\K\d+' .github/report.trigger || true)
              npm run send-candidates -- --limit ${n:-3} ;;
            keys)
              # пул ключей Gemini: сколько видит бот и живой ли каждый
              npx tsx scripts/keys-check.ts ;;
            sources)
              # проверка источников: каждый архив и запрос по отдельности
              npx tsx scripts/sources-check.ts ;;
            probe)
              # кандидаты в источники до включения: образцы, годы, размеры
              npx tsx scripts/probe-sources.ts ;;
            diversity)
              # разбор вышедших постов: архивы, эпохи, темы, серии подряд
              n=$(grep -oP 'diversity:\K\d+' .github/report.trigger || true)
              npx tsx scripts/diversity.ts ${n:-60} ;;
            handwork)
              # ручная редактура канала: чем жили посты до бота
              from=$(grep -oP 'from:\K\d{4}-\d{2}' .github/report.trigger || true)
              to=$(grep -oP 'to:\K\d{4}-\d{2}' .github/report.trigger || true)
              npx tsx scripts/channel-posts.ts --from "$from" --to "$to" --brief ;;
            style)
              before=$(grep -oP 'before:\K\d+' .github/report.trigger || true)
              month=$(grep -oP 'month:\K\d{4}-\d{2}' .github/report.trigger || true)
              npx tsx scripts/channel-posts.ts 30 ${before:+--before $before} ${month:+--month $month} ;;
            *) npm run review-captions -- 15 ;;
          esac
