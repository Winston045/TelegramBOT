name: daily-collect

on:
  schedule:
    # 05:30 UTC = 08:30 МСК: за час до первого слота публикации (09:30),
    # чтобы редакторы успели одобрить свежие карточки. Квота Gemini
    # сбрасывается только в 10:00 МСК, то есть сбор идёт на вчерашних
    # остатках - при расходе ~40 запросов из 250 в день их всегда хватает;
    # если нет, бот напишет в чат, а /more после 10:00 доберёт на свежей.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      EDITORS_CHAT_ID: ${{ secrets.EDITORS_CHAT_ID }}
      EDITOR_USER_IDS: ${{ secrets.EDITOR_USER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
    steps:
      - name: Секреты настроены?
        id: guard
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$SUPABASE_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "секреты не настроены — запуск пропущен"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
        if: steps.guard.outputs.ok == 'true'
      - name: Сбор кандидатов (источники → скоринг → подписи)
        if: steps.guard.outputs.ok == 'true'
        run: npm run collect
      - name: Отправка карточек редакторам
        if: steps.guard.outputs.ok == 'true'
        run: npm run send-candidates
      - name: Утренняя сводка
        if: steps.guard.outputs.ok == 'true'
        run: npx tsx scripts/digest.ts
