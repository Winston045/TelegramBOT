name: deploy-webhook

# Деплой Edge Function tg-webhook и настройка вебхука Телеграма — целиком
# из Actions, без локальной установки Supabase CLI.
#
# Нужные секреты:
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_URL, SUPABASE_SECRET_KEY, BOT_TOKEN, CHANNEL_ID, EDITOR_USER_IDS
#   TG_WEBHOOK_SECRET — любая случайная строка (защита вебхука)
#
# Запуск: пуш в .github/deploy-webhook.trigger или Actions → Run workflow.

#
# Секреты - только из Settings → Secrets. Раньше их можно было вписать в
# поля ручного запуска, но GitHub не маскирует такие поля: в публичном
# репозитории токен бота лёг бы в логи открытым текстом.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/starting-work-tpehs7]
    paths:
      - ".github/deploy-webhook.trigger"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      EDITOR_USER_IDS: ${{ secrets.EDITOR_USER_IDS }}
      TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
    steps:
      - name: Секреты на месте?
        run: |
          missing=""
          # без TG_WEBHOOK_SECRET функция теперь не стартует: открытый
          # вебхук принимал бы поддельные апдейты от имени редакторов
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_SECRET_KEY BOT_TOKEN CHANNEL_ID EDITOR_USER_IDS TG_WEBHOOK_SECRET; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::не настроены секреты:$missing"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Project ref из SUPABASE_URL
        id: ref
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co/?#\1#')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # ключ базы НЕ передаём: имена с префиксом SUPABASE_ зарезервированы,
      # функция берёт служебный SUPABASE_SERVICE_ROLE_KEY из своей среды.
      # INSTANT_PUBLISH=true — тестовый режим: /ok публикует сразу. По
      # умолчанию выключен: пропавшая переменная не должна молча включать
      # тестовый режим в боевом канале. Включить: Settings → Secrets and
      # variables → Actions → Variables → INSTANT_PUBLISH=true, передеплой.
      - name: Переменные окружения функции
        run: |
          times=$(python3 -c "import yaml;c=yaml.safe_load(open('config.yaml'));print(','.join(c['publish']['times']))")
          # identity бота — чтобы функция не звала getMe на буте
          # (зависание этого вызова однажды повесило весь вебхук)
          bot_info=$(curl -s --max-time 20 "https://api.telegram.org/bot$BOT_TOKEN/getMe" \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["result"]))' 2>/dev/null || true)
          echo "BOT_INFO: ${bot_info:-'(getMe недоступен, функция возьмёт запасной вариант)'}"
          supabase secrets set --project-ref "${{ steps.ref.outputs.ref }}" \
            BOT_INFO="$bot_info" \
            BOT_TOKEN="$BOT_TOKEN" \
            CHANNEL_ID="$CHANNEL_ID" \
            EDITOR_USER_IDS="$EDITOR_USER_IDS" \
            TG_WEBHOOK_SECRET="$TG_WEBHOOK_SECRET" \
            INSTANT_PUBLISH="${{ vars.INSTANT_PUBLISH || 'false' }}" \
            PUBLISH_TIMES="$times" \
            PUBLISH_TZ_OFFSET="+03:00" \
            GH_REPO="${{ github.repository }}" \
            GH_BRANCH="${{ github.ref_name }}" \
            GH_PAT="${{ secrets.GH_PAT }}"
      - name: Деплой tg-webhook
        run: supabase functions deploy tg-webhook --no-verify-jwt --project-ref "${{ steps.ref.outputs.ref }}"
      # пинг-функция без зависимостей: отделяет проблемы платформы от кода
      - name: Деплой health-пинга
        run: supabase functions deploy health --no-verify-jwt --project-ref "${{ steps.ref.outputs.ref }}"
      # следы диагностики инцидента 27.07 — сносим, если ещё остались
      - name: Удалить диагностические функции
        run: |
          for fn in bisect1 bisect2 bisect3 bisect4 npmprobe tg-webhook2; do
            supabase functions delete "$fn" --project-ref "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1 \
              && echo "$fn удалена" || true
          done
      - name: Статус платформы и пинг
        run: |
          echo "--- status.supabase.com ---"
          curl -s --max-time 15 "https://status.supabase.com/api/v2/status.json" || echo "(статус недоступен)"
          echo
          echo "--- health-пинг ---"
          code=$(curl -s -o /tmp/h -w "%{http_code}" --max-time 25 \
            "$SUPABASE_URL/functions/v1/health") || code=timeout
          echo "health: HTTP $code"
          [ -f /tmp/h ] && cat /tmp/h; echo
      - name: Настроить вебхук Телеграма
        run: |
          url="$SUPABASE_URL/functions/v1/tg-webhook"
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            --data-urlencode "url=$url" \
            --data-urlencode "secret_token=$TG_WEBHOOK_SECRET" \
            --data-urlencode "allowed_updates=[\"message\",\"callback_query\"]"
          echo
      # холодный старт после деплоя иногда отдаёт 546 WORKER_RESOURCE_LIMIT
      # (бандл компилируется при первом вызове) — поэтому до 4 попыток
      - name: Самопроверка функции
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /tmp/resp -w "%{http_code}" --max-time 60 -X POST \
              "$SUPABASE_URL/functions/v1/tg-webhook" \
              -H "content-type: application/json" \
              -H "X-Telegram-Bot-Api-Secret-Token: $TG_WEBHOOK_SECRET" \
              -d '{"update_id":1}' || echo 000)  # 000 = таймаут/обрыв, не роняем шаг
            echo "попытка $attempt: HTTP $code"
            cat /tmp/resp; echo
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then break; fi
            [ "$attempt" = 4 ] && {
              echo "::error::функция падает — смотри логи в Supabase Dashboard -> Edge Functions"
              exit 1
            }
            sleep 15
          done
          sleep 5
          echo "--- getWebhookInfo (ищи last_error_message) ---"
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo"
