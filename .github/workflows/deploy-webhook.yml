name: deploy-webhook

# Деплой Edge Function tg-webhook и настройка вебхука Телеграма — целиком
# из Actions, без локальной установки Supabase CLI.
#
# Нужные секреты:
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_URL, SUPABASE_SECRET_KEY, BOT_TOKEN, CHANNEL_ID, EDITOR_USER_IDS
#   TG_WEBHOOK_SECRET — любая случайная строка (защита вебхука)
#
# Запуск: пуш в .github/deploy-webhook.trigger или Actions → Run workflow.

on:
  workflow_dispatch:
    inputs:
      supabase_access_token:
        description: "SUPABASE_ACCESS_TOKEN (sbp_...)"
        required: false
      bot_token:
        description: "BOT_TOKEN"
        required: false
      channel_id:
        description: "CHANNEL_ID (@канал)"
        required: false
      editor_user_ids:
        description: "EDITOR_USER_IDS (через запятую)"
        required: false
      tg_webhook_secret:
        description: "TG_WEBHOOK_SECRET (любая строка)"
        required: false
  push:
    paths:
      - ".github/deploy-webhook.trigger"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || inputs.supabase_access_token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN || inputs.bot_token }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID || inputs.channel_id }}
      EDITOR_USER_IDS: ${{ secrets.EDITOR_USER_IDS || inputs.editor_user_ids }}
      TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET || inputs.tg_webhook_secret }}
    steps:
      - name: Секреты на месте?
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_SECRET_KEY BOT_TOKEN CHANNEL_ID EDITOR_USER_IDS; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::не настроены секреты:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Project ref из SUPABASE_URL
        id: ref
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co/?#\1#')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # ключ базы НЕ передаём: имена с префиксом SUPABASE_ зарезервированы,
      # функция берёт служебный SUPABASE_SERVICE_ROLE_KEY из своей среды.
      # INSTANT_PUBLISH=true — тестовый режим: /ok публикует сразу.
      # Для боевого режима: Settings → Secrets and variables → Actions →
      # вкладка Variables → INSTANT_PUBLISH=false, затем перезапустить деплой.
      - name: Переменные окружения функции
        run: |
          times=$(python3 -c "import yaml;c=yaml.safe_load(open('config.yaml'));print(','.join(c['publish']['times']))")
          supabase secrets set --project-ref "${{ steps.ref.outputs.ref }}" \
            BOT_TOKEN="$BOT_TOKEN" \
            CHANNEL_ID="$CHANNEL_ID" \
            EDITOR_USER_IDS="$EDITOR_USER_IDS" \
            TG_WEBHOOK_SECRET="$TG_WEBHOOK_SECRET" \
            INSTANT_PUBLISH="${{ vars.INSTANT_PUBLISH || 'true' }}" \
            PUBLISH_TIMES="$times" \
            PUBLISH_TZ_OFFSET="+03:00" \
            GH_REPO="${{ github.repository }}" \
            GH_PAT="${{ secrets.GH_PAT }}"
      - name: Деплой tg-webhook
        run: supabase functions deploy tg-webhook --no-verify-jwt --project-ref "${{ steps.ref.outputs.ref }}"
      - name: Настроить вебхук Телеграма
        run: |
          url="$SUPABASE_URL/functions/v1/tg-webhook"
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            --data-urlencode "url=$url" \
            --data-urlencode "secret_token=$TG_WEBHOOK_SECRET" \
            --data-urlencode "allowed_updates=[\"message\",\"callback_query\"]"
          echo
      # холодный старт после деплоя иногда отдаёт 546 WORKER_RESOURCE_LIMIT
      # (бандл компилируется при первом вызове) — поэтому до 4 попыток
      - name: Самопроверка функции
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /tmp/resp -w "%{http_code}" --max-time 60 -X POST \
              "$SUPABASE_URL/functions/v1/tg-webhook" \
              -H "content-type: application/json" \
              -H "X-Telegram-Bot-Api-Secret-Token: $TG_WEBHOOK_SECRET" \
              -d '{"update_id":1}')
            echo "попытка $attempt: HTTP $code"
            cat /tmp/resp; echo
            if [ "$code" -lt 500 ]; then break; fi
            [ "$attempt" = 4 ] && {
              echo "::error::функция падает — смотри логи в Supabase Dashboard -> Edge Functions"
              exit 1
            }
            sleep 15
          done
          sleep 5
          echo "--- getWebhookInfo (ищи last_error_message) ---"
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo"
