name: tg-diag

# Диагностика Телеграма: состояние вебхука, права бота в канале,
# пробная отправка в канал напрямую.
# Запуск: пуш в .github/diag.trigger или Actions → Run workflow.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      EDITORS_CHAT_ID: ${{ secrets.EDITORS_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
    steps:
      - name: Вебхук (ищи pending и last_error)
        run: 'curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo"; echo'
      - name: Кто я (getMe)
        id: me
        run: |
          me=$(curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getMe")
          echo "$me"
          echo "bot_id=$(echo "$me" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["id"])')" >> "$GITHUB_OUTPUT"
      - name: Права бота в канале
        run: |
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getChatMember" \
            --data-urlencode "chat_id=$(echo "$CHANNEL_ID" | xargs)" \
            --data-urlencode "user_id=${{ steps.me.outputs.bot_id }}"
          echo
      # куда реально смотрят секреты: имена канала и чата (не сами секреты)
      - name: Куда постим и где чат
        run: |
          for chat in "$CHANNEL_ID" "$EDITORS_CHAT_ID"; do
            curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getChat" \
              --data-urlencode "chat_id=$(echo "$chat" | xargs)" \
              | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result",{}); print("тип:", r.get("type"), "| название:", r.get("title") or r.get("username"))'
          done
      # шаг с пробным постом в канал удалён: в боевом режиме случайный
      # запуск диагностики не должен писать подписчикам
      # три запроса разной глубины: GET (бут), POST без секрета (грамми
      # отвечает сам), POST с секретом (полная обработка). Что виснет —
      # то и сломано: всё = бут/платформа, только последний = обработчик.
      - name: Проба вебхука
        run: |
          probe_wh() {
            code=$(curl -s -o /tmp/whresp -w "%{http_code}" --max-time 25 "$@" \
              "$SUPABASE_URL/functions/v1/tg-webhook") || code=timeout
            echo "-> HTTP $code"
            [ -f /tmp/whresp ] && head -c 300 /tmp/whresp && rm -f /tmp/whresp
            echo
          }
          echo "GET без всего:"; probe_wh
          echo "POST без секрета:"; probe_wh -X POST -H "content-type: application/json" -d '{"update_id":1}'
          echo "POST с секретом:"; probe_wh -X POST -H "content-type: application/json" \
            -H "X-Telegram-Bot-Api-Secret-Token: $TG_WEBHOOK_SECRET" -d '{"update_id":1}'
      - name: Проба категорий Commons
        run: |
          titles="Category:Images from the Imperial War Museum|Category:Files from the Imperial War Museum|Category:Photographs from the Imperial War Museum|Category:Imperial War Museum|Category:World War II photographs from the Imperial War Museum"
          curl -sSG "https://commons.wikimedia.org/w/api.php" \
            --data-urlencode "action=query" \
            --data-urlencode "format=json" \
            --data-urlencode "formatversion=2" \
            --data-urlencode "prop=categoryinfo" \
            --data-urlencode "titles=$titles" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('query',{}).get('pages',[]):
              ci=p.get('categoryinfo')
              missing=p.get('missing',False)
              print(('НЕТ ' if missing or not ci else f\"файлов {ci['files']:>7} \") + p['title'])
          "
          echo "--- поиск по названиям файлов ---"
          for q in 'intitle:\"RIAN archive\" 1943' 'incategory:\"Images from the Australian War Memorial\" 1943' 'incategory:\"Images from RIA Novosti\" war'; do
            n=$(curl -sSG "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode "action=query" --data-urlencode "format=json" \
              --data-urlencode "list=search" --data-urlencode "srnamespace=6" \
              --data-urlencode "srlimit=1" --data-urlencode "srinfo=totalhits" \
              --data-urlencode "srsearch=$q" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"]["searchinfo"]["totalhits"])')
            echo "хитов $n  <-  $q"
          done
      - name: Проба API PastVu
        run: |
          probe() {
            echo "=== $1 $2"
            curl -sSG "https://pastvu.com/api2" \
              --data-urlencode "method=$1" \
              --data-urlencode "params=$2" | head -c 1200
            echo; echo
          }
          probe "photo.giveNearestPhotos" '{"geo":[55.75,37.61],"limit":3,"skip":0}'
          probe "photo.giveNearestPhotos" '{"geo":[55.75,37.61],"limit":3,"skip":3}'
          probe "photo.giveNearestPhotos" '{"geo":[55.75,37.61],"limit":5,"year":1941,"year2":1945}'
          probe "photo.giveNearestPhotos" '{"geo":[52.52,13.40],"limit":3,"year":1939,"year2":1945}'
