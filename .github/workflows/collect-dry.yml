name: collect-dry

# Пробный сбор всухую: источники + префильтр, без Gemini и базы.
# Секреты не нужны. Запуск: Actions → collect-dry → Run workflow,
# либо пушем изменения в .github/collect-dry.trigger.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/collect-dry.trigger"

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: Сбор всухую
        run: npm run collect -- --dry
