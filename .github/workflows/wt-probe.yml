name: wt-probe

# Разовая разведка источников для бота канала по War Thunder (отдельный
# репозиторий wt-channel-bot): что отдают сайт игры, RSS, Reddit, GitHub
# с датамайнами, публичные Telegram-каналы. Ничего не пишет и не постит.
# Запуск: пуш в .github/wt-probe.trigger.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/starting-work-tpehs7]
    paths:
      - ".github/wt-probe.trigger"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Сайт игры и RSS
        run: |
          probe() {
            code=$(curl -sL -o /tmp/p -w "%{http_code} %{content_type}" --max-time 25 -A "Mozilla/5.0 (X11; Linux x86_64)" "$1") || code="ошибка"
            echo "=== $1 -> $code ($(wc -c < /tmp/p 2>/dev/null) байт)"
            head -c "${2:-600}" /tmp/p 2>/dev/null | tr '\n' ' '; echo; echo
          }
          probe "https://warthunder.com/en/news/" 1500
          probe "https://warthunder.com/ru/news/" 600
          probe "https://warthunder.com/en/rss" 800
          probe "https://warthunder.com/en/news/rss" 800
          probe "https://warthunder.com/ru/rss" 800
          probe "https://forum.warthunder.com/latest.rss" 800
          probe "https://forum.warthunder.com/c/news-and-announcements/5.rss" 800
      - name: Заголовки новостей со страницы сайта
        run: |
          curl -sL --max-time 25 -A "Mozilla/5.0" "https://warthunder.com/ru/news/" -o /tmp/n || true
          grep -oE 'href="/ru/news/[^"]+"' /tmp/n | sort -u | head -15
          grep -oE '<div class="widget__title">[^<]+' /tmp/n | head -10
          grep -oE 'og:image" content="[^"]+' /tmp/n | head -3
      - name: Страница новости (разметка)
        run: |
          url="https://warthunder.com$(curl -sL --max-time 25 -A 'Mozilla/5.0' https://warthunder.com/ru/news/ | grep -oE 'href="/ru/news/[0-9]+-[^"]+"' | head -1 | cut -d'"' -f2)"
          echo "статья: $url"
          curl -sL --max-time 25 -A "Mozilla/5.0" "$url" -o /tmp/a
          grep -oE '<meta property="og:[a-z]+" content="[^"]{0,200}' /tmp/a | head -6
          grep -oE '<meta property="article:[a-z_]+" content="[^"]+' /tmp/a | head -4
          echo "--- классы вокруг текста"
          grep -oE 'class="[^"]*(content|article|news|text|g-grid)[^"]*"' /tmp/a | sort | uniq -c | sort -rn | head -15
          echo "--- кусок текста"
          python3 - <<'PY'
          import re
          h=open('/tmp/a',encoding='utf-8',errors='ignore').read()
          for cls in ['content__article','article','news__content','g-grid','content']:
              i=h.find(cls)
              if i>0:
                  print('>>',cls,'@',i); print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',h[i:i+2500]))[:900]); break
          print('--- даты:', re.findall(r'(\d{1,2} [а-я]+ \d{4})', h)[:3])
          print('--- картинки:', re.findall(r'src="(https://static[^"]+\.(?:jpg|png|webp))', h)[:4])
          PY
      - name: Лента t.me/s/WarThunderRU (разметка поста)
        run: |
          curl -s --max-time 20 "https://t.me/s/WarThunderRU" -o /tmp/t
          python3 - <<'PY'
          import re
          h=open('/tmp/t',encoding='utf-8').read()
          posts=re.findall(r'data-post="([^"]+)"', h)
          print('посты:', posts[-5:])
          texts=re.findall(r'tgme_widget_message_text[^>]*>(.*?)</div>', h, re.S)
          for t in texts[-3:]:
              print('>>', re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t))[:300])
          print('фото:', re.findall(r"background-image:url\('([^']+)'\)", h)[-3:])
          print('ссылки на сайт:', set(re.findall(r'https://warthunder\.com/ru/news/[^"\s<]+', h)))
          PY
      - name: Датамайны (GitHub)
        run: |
          curl -s --max-time 25 "https://api.github.com/repos/gszabi99/War-Thunder-Datamine/commits?per_page=5" \
            | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,dict): print(d); sys.exit()
          for c in d: print(c["commit"]["author"]["date"], "|", c["commit"]["message"][:120].replace("\n"," "))'
      - name: Reddit без ключа
        run: |
          for u in "https://www.reddit.com/r/Warthunder/top.json?t=day&limit=5" "https://old.reddit.com/r/Warthunder/top/.rss?t=day" "https://www.reddit.com/r/Warthunder/search.rss?q=flair%3ADatamine&restrict_sr=1&sort=new"; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" --max-time 25 -A "wt-channel-bot/0.1 (Telegram channel)" "$u") || code=ошибка
            echo "=== $u -> $code"; head -c 500 /tmp/r | tr '\n' ' '; echo; echo
          done
      - name: Публичные Telegram-каналы игры
        run: |
          for ch in warthunder WarThunderRU war_thunder_ru warthunder_official gaijin_ru; do
            code=$(curl -s -o /tmp/t -w "%{http_code}" --max-time 20 "https://t.me/s/$ch") || code=ошибка
            posts=$(grep -c 'tgme_widget_message_text' /tmp/t || true)
            title=$(grep -oE '<meta property="og:title" content="[^"]+' /tmp/t | head -1 | cut -d'"' -f4)
            echo "@$ch -> $code, постов на странице: $posts, название: $title"
          done
      - name: YouTube RSS официального канала
        run: |
          for id in UCi_PSmnMBpWEi1OwDHcCI5A UCo0DBq_8GqqJpbgYnzTYDDQ; do
            code=$(curl -s -o /tmp/y -w "%{http_code}" --max-time 20 "https://www.youtube.com/feeds/videos.xml?channel_id=$id") || code=ошибка
            echo "=== $id -> $code"; grep -oE '<title>[^<]+' /tmp/y | head -4
          done
