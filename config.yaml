sources:
  loc:
    enabled: true
    weight: 20           # ниже соседей: средний кадр LOC слабее по картинке
    # без дат запросы вида "infantry" тянут Гражданскую войну США 1860-х —
    # пул шире и с привязкой к конкретным войнам и странам
    #
    # ПМВ у LOC не берём ВООБЩЕ (решение 12.08). Съёмка 1910-х здесь - это
    # стеклянные негативы Bain, Красного Креста и National Photo: серые,
    # вялые, без чёрного и белого, часто выцветшие. Дело не в разрешении -
    # материал такой сам по себе, крупный рендер лишь показывает это лучше.
    # Первую мировую закрывают IWM и NARA на Commons, там отпечатки живее.
    # Взамен - сильные пласты LOC: цветные «кодахромы» FSA/OWI 1939-1944
    # (полторы тысячи кадров, сохранность идеальная) и крупноформатная
    # съёмка военных лет.
    queries:
      - "farm security administration color kodachrome"
      - "office of war information color 1943"
      - "war production color 1942"
      - "world war 1939"
      - "world war 1944"
      - "red army"
      - "royal air force"
      - "navy pacific 1942"
      - "tank battle"
      - "military aviation 1940"
      - "pacific 1944 landing"
      # холодная война: от Кореи до восьмидесятых
      - "korean war combat"
      - "vietnam war patrol"
      - "vietnam helicopter 1968"
      - "berlin wall 1961"
      - "cuban missile crisis"
      - "cold war missile test"
  # архивы разных стран на Wikimedia Commons - главный источник разнообразия
  commons:
    enabled: true
    weight: 45
    # годы-фильтры поиска: год меняется каждый запуск, поэтому доля года в
    # списке = его доля в ленте, а ПОРЯДОК = порядок прогонов. Эпохи
    # перемешаны, чтобы соседние прогоны не сидели в одной войне (живой
    # случай: список начинался с 1916, 1918 - и резерв стал сплошной ПМВ).
    # Упор: ВМВ и вторая половина века; ПМВ - два года из шестнадцати
    categories:
      ["1941", "1951", "1916", "1943", "1965", "1940", "1953", "1972",
       "1918", "1942", "1962", "1944", "1968", "1945", "1950", "1983"]
    # имена категорий проверены пробой tg-diag 29.07: у IWM единственное
    # число, у РИА Новости и Австралии Images from ...
    archives:
      - category: "Images from the German Federal Archive"
        attribution: "Bundesarchiv"
        lang: "de"
      - category: "Photographs from the Imperial War Museum"
        attribution: "IWM"
        lang: "en"
      - category: "Images from RIA Novosti"
        attribution: "РИА Новости"
        lang: "ru"
        # названия файлов RIAN - английские описания: ищем военные прицельно,
        # а не листаем вслепую (советская доля в ленте растёт)
        terms: ["war", "front", "battle", "tank", "soldiers", "aviation"]
      - category: "Images from the National Archives and Records Administration"
        attribution: "NARA"
        lang: "en"
        terms:
          ["photograph 1918", "photograph 1942", "photograph 1944", "photograph 1945",
           "photograph 1951", "photograph 1966", "photograph 1968", "photograph 1972"]
      - category: "Images from the Australian War Memorial"
        attribution: "AWM"
        lang: "en"
      # проверено пробой 03.08: 2058 файлов, поиск по годам работает.
      # Финский военный архив - Зимняя война и Продолжение, много движения
      - category: "SA-kuva"
        attribution: "SA-kuva"
        lang: "fi"
        terms: ["1940", "1941", "1942", "1943", "1944"]
      # 630 тысяч файлов: американская хроника обеих войн, много репортажа
      - category: "Images from the Library of Congress"
        attribution: "Library of Congress"
        lang: "en"
      # 314 тысяч пресс-фото 1945-1989 (CC BY-SA/CC0): холодная война,
      # Европа, техника - закрывает дефицитную вторую половину века
      - category: "Images from Anefo"
        attribution: "Anefo / Nationaal Archief"
        lang: "nl"
        terms:
          ["1946", "1948", "1953", "1956", "1961", "1968", "1975", "1983"]
      # 5 тысяч кадров армейской съёмки США 1941-1954 (ВМВ и Корея):
      # противоядие от преобладания немецкой съёмки
      - category: "United States Army Signal Corps photographs"
        attribution: "US Army Signal Corps"
        lang: "en"
        terms: [""]        # категория небольшая - листаем всю подряд
  # прежний узкий источник: остался ради истории, включать не нужно -
  # Бундесархив теперь один из архивов commons
  bundesarchiv:
    enabled: false
    weight: 0
    categories: ["1939", "1940", "1941", "1942", "1943", "1944", "1945"]
  pastvu:
    enabled: true        # контракт API проверен вживую (tg-diag)
    weight: 25           # городская хроника: хорош для разбавки, не для базы
    years: [1914, 1990]
  nara:
    enabled: false       # нужен бесплатный ключ: секрет NARA_API_KEY
    weight: 20
    queries: ["world war", "infantry"]
  europeana:
    enabled: false       # нужен бесплатный ключ: секрет EUROPEANA_API_KEY
    weight: 20
    queries: ["world war 1914-1918", "world war 1939-1945"]

collect:
  raw_limit: 150         # сколько тянем из архивов
  prefilter_keep: 30     # сколько доживает до vision-скоринга
  daily_candidates: 10   # сколько уходит редакторам
  min_image_width: 1000  # ниже тысячи кадр в Телеграме заметно мылит
  # порог отсекает только брак: нечитаемые сканы, документы вместо фото,
  # современность. Характер ленты (движение, разнообразие, доля мирного)
  # решает планировщик при публикации, а не эта цифра - иначе целые архивы
  # выпадают из оборота и хороший контент кончается
  min_score: 40          # слабее этой оценки в резерв не пишем
  # канал про военную историю: ПМВ, ВМВ, холодная война до конца века
  min_year: 1850
  max_year: 1999

publish:
  times: ["09:00", "12:30", "15:00", "18:00", "21:00"]
  timezone: "Europe/Moscow"
  min_queue_warning: 5
  auto_publish: false    # true = публиковать без аппрува

balance:
  max_same_tag_per_week: 3   # не долбить одну тему

filters:
  # цензуры нет по решению редакции: каждый кандидат всё равно проходит
  # ручной отбор в чате, автоматика ничего не отсеивает по содержанию
  stop_words: []
  block_nazi_symbols: false

# устоявшиеся русские названия: без них модель переводит калькой,
# а знающий читатель это замечает сразу
