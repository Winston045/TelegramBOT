sources:
  loc:
    enabled: true
    weight: 20           # ниже соседей: средний кадр LOC слабее по картинке
    # без дат запросы вида "infantry" тянут Гражданскую войну США 1860-х —
    # пул шире и с привязкой к конкретным войнам и странам
    #
    # ПМВ у LOC не берём ВООБЩЕ (решение 12.08). Съёмка 1910-х здесь - это
    # стеклянные негативы Bain, Красного Креста и National Photo: серые,
    # вялые, без чёрного и белого, часто выцветшие. Дело не в разрешении -
    # материал такой сам по себе, крупный рендер лишь показывает это лучше.
    # Первую мировую закрывают IWM и NARA на Commons, там отпечатки живее.
    # Взамен - сильные пласты LOC: цветные «кодахромы» FSA/OWI 1939-1944
    # (полторы тысячи кадров, сохранность идеальная) и крупноформатная
    # съёмка военных лет.
    queries:
      # Список выверен пробой 14.08 (scripts/sources-check.ts): каждый
      # запрос проверен отдельно, «годных» - сколько записей дошло до
      # кандидатов. Шесть прежних формулировок давали ноль годных и были
      # заменены: LOC либо не находил по ним ничего («red army»,
      # «vietnam helicopter 1968»), либо отдавал карточки коллекций с
      # заглушкой вместо фотографии («world war 1939», «cuban missile
      # crisis», «military aviation 1940», «vietnam war patrol»).
      # Три запроса выродились к 31.08 в ноль годных (выдача съехала на
      # карточки коллекций): «farm security administration color kodachrome»,
      # «office of war information color 1943», «office of war information
      # photograph 1944». Замены по рабочей формуле «театр + год +
      # photograph»; цветной пласт пробуем через имя носителя - в каталоге
      # LOC кодахромы подписаны «transparencies»
      # проба 01.09: «color transparencies 1943» отдаёт кадры без места и
      # без описания - всё гибнет на префильтре. Цвет надёжно несёт только
      # формула «war production color»: расширяем её на второй год
      - "war production color 1943"
      - "guadalcanal 1943 photograph"
      - "war production color 1942"                       # годных 5
      - "pacific 1944 landing"                            # годных 5
      - "royal air force"                                 # годных 4
      - "berlin wall 1961"                                # годных 4
      - "navy pacific 1942"                               # годных 3
      - "tank battle"                                     # годных 3
      # проба 01.09: «korean war combat» выродился в карточки альбомов
      # (album_record×3), «cold war missile test» - годный без года.
      # Замены по рабочей формуле «театр + год + photograph»
      - "korea 1953 photograph"
      - "world war 1944"                                  # годных 1
      - "bikini atoll 1946 photograph"
      # Замены, проверенные пробой: работает формула «театр + год +
      # слово photograph». По ней LOC отдаёт снимки, а не карточки
      # коллекций. «normandy 1944 photograph» и «soldiers training 1942
      # photograph» по той же формуле дали ноль и заменены дальше.
      - "italy 1944 photograph"
      - "marines pacific 1945 photograph"
      - "philippines 1945 photograph"
      - "korea 1951 photograph"
      - "vietnam 1967 photograph"
      # был «kodachrome 1943 photograph»: проба 01.09 - кадры без места,
      # префильтр не пропускает ни одного
      - "aircraft color 1942"
  # архивы разных стран на Wikimedia Commons - главный источник разнообразия
  commons:
    enabled: true
    weight: 45
    # годы-фильтры поиска: год меняется каждый запуск, поэтому доля года в
    # списке = его доля в ленте, а ПОРЯДОК = порядок прогонов. Эпохи
    # перемешаны, чтобы соседние прогоны не сидели в одной войне (живой
    # случай: список начинался с 1916, 1918 - и резерв стал сплошной ПМВ).
    # Замер ленты 24.08: ВМВ заняла 70% и шла девятками - при шести годах
    # ВМВ из шестнадцати сырьё всё равно выходило военно-сороковым, потому
    # что ВМВ и так ядро каждого архива. Годы ВМВ ужаты до четырёх, взамен
    # 1938 (Мюнхен, аншлюс - у Бундесархива богатый пласт) и 1979
    # (Афганистан у РИА, поздняя холодная война у Anefo и Бундесархива)
    categories:
      ["1941", "1951", "1916", "1938", "1965", "1940", "1953", "1972",
       "1918", "1942", "1962", "1979", "1968", "1945", "1950", "1983"]
    # имена категорий проверены пробой tg-diag 29.07: у IWM единственное
    # число, у РИА Новости и Австралии Images from ...
    archives:
      - category: "Images from the German Federal Archive"
        attribution: "Bundesarchiv"
        lang: "de"
      - category: "Photographs from the Imperial War Museum"
        attribution: "IWM"
        lang: "en"
      - category: "Images from RIA Novosti"
        attribution: "РИА Новости"
        lang: "ru"
        # названия файлов RIAN - английские описания: ищем военные прицельно,
        # а не листаем вслепую (советская доля в ленте растёт)
        terms: ["war", "front", "battle", "tank", "soldiers", "aviation"]
      - category: "Images from the National Archives and Records Administration"
        attribution: "NARA"
        lang: "en"
        terms:
          ["photograph 1918", "photograph 1942", "photograph 1944", "photograph 1945",
           "photograph 1951", "photograph 1966", "photograph 1968", "photograph 1972"]
      - category: "Images from the Australian War Memorial"
        attribution: "AWM"
        lang: "en"
      # проверено пробой 03.08: 2058 файлов, поиск по годам работает.
      # Финский военный архив - Зимняя война и Продолжение, много движения
      - category: "SA-kuva"
        attribution: "SA-kuva"
        lang: "fi"
        terms: ["1940", "1941", "1942", "1943", "1944"]
      # 630 тысяч файлов: американская хроника обеих войн, много репортажа
      - category: "Images from the Library of Congress"
        attribution: "Library of Congress"
        lang: "en"
      # 314 тысяч пресс-фото 1945-1989 (CC BY-SA/CC0): холодная война,
      # Европа, техника - закрывает дефицитную вторую половину века
      - category: "Images from Anefo"
        attribution: "Anefo / Nationaal Archief"
        lang: "nl"
        # листание по голым годам тащило гражданскую хронику Нидерландов:
        # конгресс фокусников, свалку у дворца, портреты - и всё это жгло
        # слоты анализа (живая очередь 31.08: 3 из 4 кадров anefo - мимо).
        # Ищем прицельно военное, как у РИА; протесты 60-х оставляем -
        # это холодная война с живым действием
        terms:
          ["militairen", "leger", "oorlog", "soldaten", "marine",
           "luchtmacht", "parachutisten", "demonstratie 1968"]
      # 5 тысяч кадров армейской съёмки США 1941-1954 (ВМВ и Корея):
      # противоядие от преобладания немецкой съёмки
      - category: "United States Army Signal Corps photographs"
        attribution: "US Army Signal Corps"
        lang: "en"
        terms: [""]        # категория небольшая - листаем всю подряд
      # ---- Расширение 29.08: лента была на 73% англосаксонской ----
      # (замер diversity 24.08). Новые архивы принято искать пробой
      # sources-check после добавления: имя категории должно отдавать
      # живые кадры, иначе запись убираем.
      #
      # Национальный цифровой архив Польши: 15 тысяч файлов - межвоенка,
      # сентябрь 1939, оккупация, Варшавское восстание
      - category: "Images from Narodowe Archiwum Cyfrowe"
        attribution: "Narodowe Archiwum Cyfrowe"
        lang: "pl"
        terms: ["1939", "1920", "1944", "wojsko", "1943"]
      # Пресс-агентство Rol из BnF: 110 тысяч кадров 1904-1937 - Франция,
      # ПМВ и межвоенка. Эпоха старая (штраф OLD_ERA и так есть), поэтому
      # запросы прицельно военные
      - category: "Photographs by Agence Rol in the Bibliothèque nationale de France"
        attribution: "Agence Rol / BnF"
        lang: "fr"
        terms: ["guerre", "soldats", "1916", "1918", "militaire"]
      # Японская военная съёмка ВМВ (PD-Japan: до 1946 года) - Азия,
      # которой в ленте не было вовсе
      - category: "Historic Japanese World War II photographs"
        attribution: "PD-Japan"
        lang: "en"
        terms: [""]
      # Японо-китайская война 1937-1945: китайский театр, в ленте не был
      # представлен никогда. Пропаганду и карты отсеет сито. Проба 29.08:
      # листание «подряд» цепляло файлы без военного года
      # (year_out_of_range×5) - ходим прицельно по годам войны
      - category: "Second Sino-Japanese War"
        attribution: "Sino-Japanese War"
        lang: "en"
        terms: ["1937", "1938", "1939", "1941", "1944"]
      # Югославские партизаны: единственный крупный балканский пласт
      # на Commons (загрузки znaci.net и музейные)
      - category: "Partisans of Yugoslavia"
        attribution: "Yugoslav Partisans"
        lang: "en"
        terms: [""]
  # ---- Знаковые события вне войны (решение 01.09) ----
  # Мирное берём ТОЛЬКО по событиям, не по местам и годам: урок PastVu -
  # листание городов приносило соборы и колонны без крючка. Здесь каждая
  # категория - конкретное событие, кадры сами несут момент, редкость или
  # человеческую историю; пропаганду и памятники отсеет сито. Долю мирного
  # в ленте держит планировщик (не чаще одного на окно из четырёх постов),
  # этот источник лишь поставляет сырьё. Категории проверять пробой
  # sources-check после каждого изменения списка.
  events:
    enabled: true
    weight: 12
    archives:
      - category: "Apollo 11"                      # высадка на Луну, 1969
        attribution: "Apollo 11"
        lang: "en"
        terms: [""]
      - category: "Yuri Gagarin"                   # первый человек в космосе
        attribution: "Гагарин"
        lang: "en"
        # проба 01.09: по слову «1961» нашлось всего 2 файла - листаем
        # категорию целиком, современные памятники срежет фильтр года
        terms: [""]
      - category: "Hindenburg disaster"            # катастрофа дирижабля, 1937
        attribution: "Hindenburg"
        lang: "en"
        terms: [""]
      - category: "RMS Titanic"                    # 1912; современные модели срежет год
        attribution: "Titanic"
        lang: "en"
        # проба 01.09: со словом «1912» поиск пуст (в названиях файлов
        # года нет) - пробуем без слова; если категория держит файлы
        # только в подкатегориях, запись убираем
        terms: [""]
      - category: "1906 San Francisco earthquake"  # великое землетрясение
        attribution: "San Francisco 1906"
        lang: "en"
        terms: [""]
      - category: "Terra Nova Expedition"          # Скотт к Южному полюсу, съёмка Понтинга
        attribution: "Terra Nova Expedition"
        lang: "en"
        terms: [""]
      - category: "Construction of the Empire State Building"  # монтажники на балках, 1930-31
        attribution: "Empire State Building"
        lang: "en"
        terms: [""]
      # проба 01.09: категории «Fall of the Berlin Wall» с файлами напрямую
      # нет. Падение Стены берём из Бундесархива прицельными словами -
      # его съёмка ноября 1989 лежит в общей категории архива
      - category: "Images from the German Federal Archive"
        attribution: "Mauerfall 1989"
        lang: "de"
        terms: ["Mauerfall", "Grenzöffnung 1989"]

  # прежний узкий источник: остался ради истории, включать не нужно -
  # Бундесархив теперь один из архивов commons
  bundesarchiv:
    enabled: false
    weight: 0
    categories: ["1939", "1940", "1941", "1942", "1943", "1944", "1945"]
  pastvu:
    # ВЫКЛЮЧЕН 12.08 по итогам сухого прогона. PastVu - гражданская
    # городская съёмка, и в очередь на анализ он приносил соборы,
    # иконостасы и колонны: «Domkirche St. Stephan», «Иконостас церкви
    # Ризположения», «Александровская колонна», «Дворцовая площадь».
    # Шесть кадров из тридцати, то есть пятая часть анализа и двенадцать
    # запросов к Gemini - на архитектурные открытки, у которых по
    # определению не может быть крючка. Включать обратно, только если
    # найдём способ просить у него именно военную хронику.
    enabled: false
    weight: 25
    years: [1914, 1990]
  nara:
    enabled: false       # нужен бесплатный ключ: секрет NARA_API_KEY
    weight: 20
    queries: ["world war", "infantry"]
  europeana:
    enabled: false       # нужен бесплатный ключ: секрет EUROPEANA_API_KEY
    weight: 20
    queries: ["world war 1914-1918", "world war 1939-1945"]

collect:
  raw_limit: 150         # сколько тянем из архивов
  prefilter_keep: 30     # сколько доживает до vision-скоринга
  daily_candidates: 10   # сколько уходит редакторам
  # Порог ширины. 12.08 поднимали с 700 до 1000 ради чёткости, но проба
  # по архивам 16.08 показала, что бьёт он неравномерно: у Бундесархива
  # сканы крупные и проходят, а у РИА Новости отсеивались 4 кадра из 6,
  # у AWM - 5 из 6, у IWM - 3 из 6. То есть порог своими руками усиливал
  # немецкий перекос и вычищал из ленты советские и австралийские кадры.
  # 800 возвращает их в оборот; за мыло и вялость теперь отдельно бьёт
  # оценка (потолок 45 при мягком фокусе), а это точнее, чем ширина.
  min_image_width: 800
  # Свой порог для архивов с мелкими сканами. Замер 16.08: снижение общего
  # порога до 800 вернуло IWM (1→4 из 6) и AWM (1→3), а РИА Новости так и
  # остался на 2 из 6 - его файлы мельче. Ронять планку всем ради одного
  # архива неправильно, поэтому послабление точечное: советская съёмка в
  # ленте нужна, а мыло всё равно отсеет оценка.
  min_image_width_by_archive:
    "риа новости": 600
  # порог отсекает только брак: нечитаемые сканы, документы вместо фото,
  # современность. Характер ленты (движение, разнообразие, доля мирного)
  # решает планировщик при публикации, а не эта цифра - иначе целые архивы
  # выпадают из оборота и хороший контент кончается
  min_score: 40          # слабее этой оценки в резерв не пишем
  # Решение редакции 12.08: у поста должен быть КРЮЧОК. Список крючков
  # выведен из 1286 постов ручной редактуры (ноябрь 2024 - апрель 2025):
  # трофей, обломки, момент, редкость, странность, человеческая история,
  # действие. Кадр без крючка - позирование, построение, портрет без
  # истории, учения в тылу - в резерв не попадает вовсе, кроме
  # исключительных. До этого такие кадры лишь придерживал планировщик,
  # и лента копила солдат, позирующих с девушками.
  hookless_min_score: 85 # кадр без крючка берём только с такой оценкой
  # канал про военную историю: ПМВ, ВМВ, холодная война до конца века
  min_year: 1850
  max_year: 1999

publish:
  times: ["09:00", "12:30", "15:00", "18:00", "21:00"]
  timezone: "Europe/Moscow"
  min_queue_warning: 5
  auto_publish: false    # true = публиковать без аппрува

balance:
  max_same_tag_per_week: 3   # не долбить одну тему

filters:
  # цензуры нет по решению редакции: каждый кандидат всё равно проходит
  # ручной отбор в чате, автоматика ничего не отсеивает по содержанию
  stop_words: []
  block_nazi_symbols: false

# устоявшиеся русские названия: без них модель переводит калькой,
# а знающий читатель это замечает сразу
