sources:
  loc:
    enabled: true
    weight: 30           # доля в дневной выборке
    queries: ["world war", "infantry", "artillery", "warship"]
  bundesarchiv:
    enabled: true
    weight: 40           # почти целиком военная тематика — канал про это
    categories: ["1939", "1940", "1941", "1942", "1943", "1944", "1945"]
  pastvu:
    enabled: true        # контракт API проверен вживую (tg-diag)
    weight: 30
    years: [1914, 1960]
  nara:
    enabled: false       # нужен бесплатный ключ: секрет NARA_API_KEY
    weight: 20
    queries: ["world war", "infantry"]
  europeana:
    enabled: false       # нужен бесплатный ключ: секрет EUROPEANA_API_KEY
    weight: 20
    queries: ["world war 1914-1918", "world war 1939-1945"]

collect:
  raw_limit: 150         # сколько тянем из архивов
  prefilter_keep: 30     # сколько доживает до vision-скоринга
  daily_candidates: 10   # сколько уходит редакторам
  min_image_width: 700
  # канал про военную историю: ПМВ, ВМВ, холодная война; современность — мимо
  min_year: 1850
  max_year: 1990

publish:
  times: ["09:00", "12:30", "15:00", "18:00", "21:00"]
  timezone: "Europe/Moscow"
  min_queue_warning: 5
  auto_publish: false    # true = публиковать без аппрува

balance:
  max_same_tag_per_week: 3   # не долбить одну тему

filters:
  # цензуры нет по решению редакции: каждый кандидат всё равно проходит
  # ручной отбор в чате, автоматика ничего не отсеивает по содержанию
  stop_words: []
  block_nazi_symbols: false

glossary:
  "Königsberg": "Кёнигсберг"
  "Guards Rifle Division": "гвардейская стрелковая дивизия"
  "Sherman": "Шерман"

channel:
  id: "@Story_Teams"
  signature: "STORY | TEAM"
  signature_url: "https://t.me/Story_Teams"
